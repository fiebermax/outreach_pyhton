<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preisliste Beispiel</title>
<style>body{margin:0} .scroll{overflow-x:auto;max-width:100%} table{width:900px}</style></head>
<body><main><h1>Preisliste</h1>
<div class="scroll"><table><tr><td>Leistung</td><td>Preis</td><td>Einheit</td><td>Bemerkung</td></tr></table></div>
<p>Eine breite Tabelle in einem scrollbaren Container ist kein Layoutfehler.</p></main></body></html>
